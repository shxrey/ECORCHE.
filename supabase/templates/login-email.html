<!--
  Paste into BOTH of these Supabase email templates
  (Dashboard → Authentication → Emails → Templates):
    • "Magic link or OTP" (returning lifters)
    • "Confirm sign up"   (first-time lifters)
  Subject for both:  {{ .Token }} is your ÉCORCHÉ verification code
  Sent through Resend (custom SMTP) from login@ecorche.app, sender name ÉCORCHÉ.

  Written so mail apps recognise it as a one-time code (Gmail's "Copy code"
  button, iOS/macOS code autofill, lock-screen previews):
    • the code is in the subject and the hidden preview line, next to the
      words "verification code";
    • the code is one plain run of digits (no per-digit boxes or spans);
    • tapping it selects the whole code in clients that honour user-select.
  Gmail decides for itself whether to show "Copy code"; there is no markup
  that forces it.
-->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent">Your &Eacute;CORCH&Eacute; verification code is {{ .Token }}. It expires in 1 hour.</div>
<div style="background:#0A0B08;padding:32px 16px;font-family:Inter,Segoe UI,Arial,sans-serif;color:#F4F5F0">
  <div style="max-width:440px;margin:0 auto;background:#181A15;border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:32px 24px">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#6FC9A4;font-family:monospace">&Eacute;CORCH&Eacute;</p>
    <h1 style="margin:0 0 16px;font-size:28px;letter-spacing:1px;text-transform:uppercase">Verification code</h1>
    <p style="margin:0 0 20px;color:#969C8C;font-size:15px">Enter this verification code in the app to sign in:</p>
    <p style="margin:0 0 24px;padding:16px;background:#0A0B08;border:1px solid rgba(111,201,164,0.4);border-radius:12px;text-align:center;font-size:36px;font-weight:700;letter-spacing:8px;font-family:'JetBrains Mono',Consolas,monospace;color:#F4F5F0;-webkit-user-select:all;user-select:all">{{ .Token }}</p>
    <p style="margin:0 0 24px;color:#969C8C;font-size:15px">
      Or <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="color:#6FC9A4">tap here to sign in on this device</a>.
    </p>
    <p style="margin:0;color:#5A6053;font-size:12px">The code expires in 1 hour. If you didn't ask for it, ignore this email.</p>
  </div>
</div>
